[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: /admin and any refresh/deep link serve index.html.
# /api/* is served by netlify/functions/api.mts, which declares its own paths and is
# matched before this redirect.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
